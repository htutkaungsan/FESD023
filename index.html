<!doctype html>
<html lang="en" ng-app="courseApp">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SE-NCU Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body ng-controller="CourseController as vm">
    <div class="app-shell d-flex flex-column min-vh-100">
      <nav class="navbar navbar-expand-md navbar-light bg-light border-bottom" aria-label="Main navigation">
        <div class="container">
          <a class="navbar-brand fw-bold" href="#!/">SE-NCU Online</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="#!/">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#!/manage">Course</a></li>
            </ul>
          </div>
        </div>
      </nav>

      <main class="container py-4 flex-grow-1">
        <div ng-view></div>
      </main>

      <footer class="border-top bg-light py-3 text-center small">
        Software Engineering, North-Chiang Mai University 2025
      </footer>
    </div>

    <script type="text/ng-template" id="home.html">
      <div class="d-flex align-items-center justify-content-between gap-3 mb-4">
        <div>
          <p class="eyebrow mb-1">Featured learning</p>
          <h1 class="h3 mb-0">Highlighted Courses</h1>
        </div>
        <a class="btn btn-outline-primary" href="#!/courses">All Courses</a>
      </div>

      <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-4" ng-repeat="course in vm.promotedCourses() track by course.courseId">
          <article class="card course-card h-100 shadow-sm">
            <img class="card-img-top course-image" ng-src="{{ course.courseImage }}" alt="{{ course.title }} course cover">
            <div class="card-body d-flex flex-column">
              <span class="badge text-bg-primary align-self-start mb-2">{{ course.category }}</span>
              <h2 class="h5 card-title">{{ course.title }}</h2>
              <p class="card-text text-secondary flex-grow-1">{{ course.description }}</p>
              <dl class="row small mb-0">
                <dt class="col-4">Lecturer</dt><dd class="col-8">{{ course.lecturer }}</dd>
                <dt class="col-4">Duration</dt><dd class="col-8 mb-0">{{ course.duration }} hours</dd>
              </dl>
            </div>
          </article>
        </div>
      </div>
    </script>

    <script type="text/ng-template" id="courses.html">
      <div class="mb-4">
        <p class="eyebrow mb-1">Course catalog</p>
        <h1 class="h3 mb-0">All Courses</h1>
      </div>

      <div class="vstack gap-3">
        <article class="card shadow-sm" ng-repeat="course in vm.courses track by course.courseId">
          <div class="row g-0 align-items-stretch">
            <div class="col-12 col-md-4 col-lg-3">
              <img class="course-list-image" ng-src="{{ course.courseImage }}" alt="{{ course.title }} course cover">
            </div>
            <div class="col-12 col-md-8 col-lg-9">
              <div class="card-body h-100 d-flex flex-column">
                <div class="d-flex justify-content-between gap-3">
                  <h2 class="h5 card-title">{{ course.title }}</h2>
                  <span class="badge text-bg-warning align-self-start" ng-if="course.promote">Promoted</span>
                </div>
                <p class="card-text text-secondary">{{ course.description }}</p>
                <div class="row small mt-auto">
                  <div class="col-sm-4"><strong>Lecturer:</strong> {{ course.lecturer }}</div>
                  <div class="col-sm-4"><strong>Duration:</strong> {{ course.duration }} hours</div>
                  <div class="col-sm-4"><strong>Category:</strong> {{ course.category }}</div>
                </div>
              </div>
            </div>
          </div>
        </article>
      </div>
    </script>

    <script type="text/ng-template" id="manage.html">
      <div class="mb-4">
        <p class="eyebrow mb-1">Administration</p>
        <h1 class="h3 mb-0">Course Management</h1>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-header fw-semibold">Course Data</div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Title</th>
                <th scope="col">Lecturer</th>
                <th scope="col">Category</th>
                <th scope="col">Hours</th>
                <th scope="col">Promote</th>
                <th scope="col" class="text-end">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="course in vm.courses track by course.courseId" ng-class="{'table-primary': vm.form.courseId === course.courseId}">
                <td>{{ course.courseId }}</td>
                <td>{{ course.title }}</td>
                <td>{{ course.lecturer }}</td>
                <td>{{ course.category }}</td>
                <td>{{ course.duration }}</td>
                <td>{{ course.promote ? 'Yes' : 'No' }}</td>
                <td class="text-end text-nowrap">
                  <button class="btn btn-sm btn-outline-primary" type="button" ng-click="vm.editCourse(course)">Edit</button>
                  <button class="btn btn-sm btn-outline-danger" type="button" ng-click="vm.deleteCourse(course.courseId)">Delete</button>
                </td>
              </tr>
              <tr ng-if="!vm.courses.length"><td colspan="7" class="text-center text-secondary py-4">No courses available.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <form class="card shadow-sm" name="courseForm" ng-submit="vm.saveCourse(courseForm)" novalidate>
        <div class="card-header fw-semibold">{{ vm.isEditing() ? 'Update Course' : 'Add Course' }}</div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="title">Course title</label>
              <input class="form-control" id="title" name="title" ng-model="vm.form.title" maxlength="100" required>
              <div class="invalid-feedback d-block" ng-if="courseForm.$submitted && courseForm.title.$invalid">Course title is required.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="lecturer">Lecturer</label>
              <input class="form-control" id="lecturer" name="lecturer" ng-model="vm.form.lecturer" required>
              <div class="invalid-feedback d-block" ng-if="courseForm.$submitted && courseForm.lecturer.$invalid">Lecturer is required.</div>
            </div>
            <div class="col-12">
              <label class="form-label" for="description">Description</label>
              <textarea class="form-control" id="description" name="description" rows="3" ng-model="vm.form.description" maxlength="200" required></textarea>
              <div class="invalid-feedback d-block" ng-if="courseForm.$submitted && courseForm.description.$invalid">Description is required.</div>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label" for="duration">Duration (hours)</label>
              <input class="form-control" id="duration" name="duration" type="number" min="1" ng-model="vm.form.duration" required>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label" for="category">Category</label>
              <select class="form-select" id="category" name="category" ng-model="vm.form.category" ng-options="category for category in vm.categories" required>
                <option value="">Select category</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label" for="image">Course image</label>
              <select class="form-select" id="image" name="image" ng-model="vm.form.courseImage" ng-options="image.path as image.label for image in vm.images" required>
                <option value="">Select image</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-3 d-flex align-items-end">
              <div class="form-check form-switch mb-2">
                <input class="form-check-input" id="promote" type="checkbox" ng-model="vm.form.promote">
                <label class="form-check-label" for="promote">Special promotion</label>
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer d-flex gap-2">
          <button class="btn btn-primary" type="submit">{{ vm.isEditing() ? 'Update' : 'Add' }}</button>
          <button class="btn btn-outline-secondary" type="button" ng-click="vm.resetForm(courseForm)">Clear</button>
        </div>
      </form>

      <div class="alert alert-success mt-3" role="status" ng-if="vm.message">{{ vm.message }}</div>
    </script>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
