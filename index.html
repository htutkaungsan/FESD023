<!doctype html>
<html lang="en" ng-app="courseApp">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SE-NCU Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body ng-controller="CourseController as vm">
    <div class="app-shell d-flex flex-column min-vh-100">
      <nav class="navbar navbar-expand-md navbar-light bg-light border-bottom" aria-label="Main navigation">
        <div class="container">
          <a class="navbar-brand fw-bold" href="#!/">SE-NCU Online</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="#!/">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#!/manage">Course</a></li>
            </ul>
          </div>
        </div>
      </nav>

      <main class="container py-4 flex-grow-1">
        <div ng-view></div>
      </main>

      <footer class="border-top bg-light py-3 text-center small">
        Software Engineering, North-Chiang Mai University 2025
      </footer>
    </div>

    <script type="text/ng-template" id="home.html">
      <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
        <div>
          <p class="eyebrow mb-1">Featured learning</p>
          <h1 class="h3 mb-0">Highlighted Courses</h1>
        </div>
        <a class="btn btn-outline-primary" href="#!/courses">All Courses</a>
      </div>

      <div class="alert alert-success d-flex align-items-center gap-2" role="status" ng-if="vm.applicationMessage">
        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
        <span>{{ vm.applicationMessage }}</span>
      </div>

      <div class="row g-3 featured-grid justify-content-center">
        <div class="col-12 col-md-6 col-lg-4 col-xl-3" ng-repeat="course in vm.promotedCourses() track by course.courseId">
          <article class="card course-card featured-course-card h-100 shadow-sm">
            <div class="course-image-wrap">
              <img class="course-image" ng-src="{{ course.courseImage }}" alt="{{ course.title }} course cover">
            </div>
            <div class="card-body d-flex flex-column p-3">
              <div class="d-flex align-items-start justify-content-between gap-2 mb-2">
                <h2 class="h6 card-title fw-bold mb-0">{{ course.title }}</h2>
                <span class="badge category-badge">{{ course.category }}</span>
              </div>
              <p class="card-text small text-secondary featured-description mb-3">{{ course.description }}</p>
              <div class="course-meta small mt-auto">
                <div><i class="bi bi-person me-1" aria-hidden="true"></i>{{ course.lecturer }}</div>
                <div><i class="bi bi-clock me-1" aria-hidden="true"></i>{{ course.duration }} hours</div>
              </div>
              <button class="btn btn-primary featured-apply-button mt-3" type="button" ng-click="vm.applyCourse(course)" aria-label="Apply for {{ course.title }}">
                <i class="bi bi-send-check me-1" aria-hidden="true"></i> Apply
              </button>
            </div>
          </article>
        </div>
      </div>
    </script>

    <script type="text/ng-template" id="courses.html">
      <div class="mb-3">
        <p class="eyebrow mb-1">Course catalog</p>
        <h1 class="h3 mb-0">All Courses</h1>
      </div>

      <div class="alert alert-success d-flex align-items-center gap-2" role="status" ng-if="vm.applicationMessage">
        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
        <span>{{ vm.applicationMessage }}</span>
      </div>

      <div class="vstack gap-2">
        <article class="card course-list-card shadow-sm" ng-repeat="course in vm.courses track by course.courseId">
          <div class="d-flex flex-column flex-sm-row align-items-stretch">
            <div class="course-list-image-wrap">
              <img class="course-list-image" ng-src="{{ course.courseImage }}" alt="{{ course.title }} course cover">
            </div>
            <div class="flex-grow-1 min-width-0">
              <div class="card-body course-list-body h-100 d-flex flex-column p-3">
                <div class="d-flex justify-content-between align-items-start gap-3 mb-1">
                  <h2 class="h6 card-title fw-bold mb-0">{{ course.title }}</h2>
                  <span class="badge text-bg-warning align-self-start" ng-if="course.promote">Promoted</span>
                </div>
                <p class="card-text small text-secondary mb-2">{{ course.description }}</p>
                <div class="d-flex flex-wrap align-items-center gap-x-3 gap-y-1 small text-secondary mt-auto">
                  <span><i class="bi bi-person me-1" aria-hidden="true"></i>{{ course.lecturer }}</span>
                  <span><i class="bi bi-clock me-1" aria-hidden="true"></i>{{ course.duration }} hours</span>
                  <span class="badge category-badge">{{ course.category }}</span>
                </div>
                <div class="mt-2 text-end">
                  <button class="btn btn-sm btn-primary list-apply-button" type="button" ng-click="vm.applyCourse(course)" aria-label="Apply for {{ course.title }}">
                    <i class="bi bi-send-check me-1" aria-hidden="true"></i> Apply
                  </button>
                </div>
              </div>
            </div>
          </div>
        </article>
      </div>
    </script>

    <script type="text/ng-template" id="manage.html">
      <div class="mb-4">
        <p class="eyebrow mb-1">Administration</p>
        <h1 class="h3 mb-0">Course Management</h1>
      </div>

      <div class="card management-card shadow-sm">
        <div class="card-header management-card-header d-flex align-items-center justify-content-between gap-3">
          <div>
            <h2 class="h6 fw-bold mb-1">Course Data</h2>
            <p class="small text-secondary mb-0">Manage all available online courses.</p>
          </div>
          <span class="badge rounded-pill text-bg-light border">{{ vm.courses.length }} courses</span>
        </div>
        <div class="table-responsive">
          <table class="table course-table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Course</th>
                <th scope="col">Lecturer</th>
                <th scope="col">Category</th>
                <th scope="col">Hours</th>
                <th scope="col">Promote</th>
                <th scope="col" class="text-end">Action</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="course in vm.courses track by course.courseId" ng-class="{'table-primary': vm.form.courseId === course.courseId}">
                <td><span class="course-id">#{{ course.courseId }}</span></td>
                <td>
                  <div class="d-flex align-items-center gap-3 course-cell">
                    <img class="course-thumb" ng-src="{{ course.courseImage }}" alt="">
                    <div>
                      <div class="fw-semibold">{{ course.title }}</div>
                      <div class="small text-secondary course-description">{{ course.description }}</div>
                    </div>
                  </div>
                </td>
                <td class="lecturer-cell">{{ course.lecturer }}</td>
                <td><span class="badge category-badge">{{ course.category }}</span></td>
                <td><span class="text-nowrap">{{ course.duration }} hrs</span></td>
                <td>
                  <span class="badge rounded-pill" ng-class="course.promote ? 'text-bg-success' : 'text-bg-secondary'">
                    {{ course.promote ? 'Yes' : 'No' }}
                  </span>
                </td>
                <td class="text-end text-nowrap action-cell">
                  <button class="btn btn-sm btn-outline-primary" type="button" ng-click="vm.editCourse(course)" aria-label="Edit {{ course.title }}">
                    <i class="bi bi-pencil-square" aria-hidden="true"></i><span class="action-label"> Edit</span>
                  </button>
                  <button class="btn btn-sm btn-outline-danger" type="button" ng-click="vm.deleteCourse(course.courseId)" aria-label="Delete {{ course.title }}">
                    <i class="bi bi-trash3" aria-hidden="true"></i><span class="action-label"> Delete</span>
                  </button>
                </td>
              </tr>
              <tr ng-if="!vm.courses.length"><td colspan="7" class="text-center text-secondary py-4">No courses available.</td></tr>
            </tbody>
          </table>
        </div>
        <div class="card-footer bg-white border-top-0 d-flex justify-content-end p-3">
          <button class="btn btn-primary" type="button" ng-click="vm.openAddForm()" ng-if="!vm.formVisible">
            <i class="bi bi-plus-circle me-1" aria-hidden="true"></i> Add Course
          </button>
        </div>
      </div>

      <div class="alert alert-success mt-3 mb-0" role="status" ng-if="vm.message">{{ vm.message }}</div>

      <form id="course-form" class="card course-form-card shadow-sm mt-4" name="courseForm" ng-submit="vm.saveCourse(courseForm)" ng-if="vm.formVisible" novalidate>
        <div class="card-header d-flex align-items-center justify-content-between gap-3">
          <div>
            <h2 class="h6 fw-bold mb-1">{{ vm.isEditing() ? 'Update Course' : 'Add Course' }}</h2>
            <p class="small text-secondary mb-0">{{ vm.isEditing() ? 'Edit the selected course information.' : 'Enter the new course information.' }}</p>
          </div>
          <button class="btn-close" type="button" ng-click="vm.closeForm(courseForm)" aria-label="Close form"></button>
        </div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="title">Course title</label>
              <input class="form-control" id="title" name="title" ng-model="vm.form.title" maxlength="100" required>
              <div class="invalid-feedback d-block" ng-if="courseForm.$submitted && courseForm.title.$invalid">Course title is required.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="lecturer">Lecturer</label>
              <input class="form-control" id="lecturer" name="lecturer" ng-model="vm.form.lecturer" required>
              <div class="invalid-feedback d-block" ng-if="courseForm.$submitted && courseForm.lecturer.$invalid">Lecturer is required.</div>
            </div>
            <div class="col-12">
              <label class="form-label" for="description">Description</label>
              <textarea class="form-control" id="description" name="description" rows="3" ng-model="vm.form.description" maxlength="200" required></textarea>
              <div class="invalid-feedback d-block" ng-if="courseForm.$submitted && courseForm.description.$invalid">Description is required.</div>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label" for="duration">Duration (hours)</label>
              <input class="form-control" id="duration" name="duration" type="number" min="1" ng-model="vm.form.duration" required>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label" for="category">Category</label>
              <select class="form-select" id="category" name="category" ng-model="vm.form.category" ng-options="category for category in vm.categories" required>
                <option value="">Select category</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label" for="image">Course image</label>
              <select class="form-select" id="image" name="image" ng-model="vm.form.courseImage" ng-options="image.path as image.label for image in vm.images" required>
                <option value="">Select image</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-3 d-flex align-items-end">
              <div class="form-check form-switch mb-2">
                <input class="form-check-input" id="promote" type="checkbox" ng-model="vm.form.promote">
                <label class="form-check-label" for="promote">Special promotion</label>
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer bg-light d-flex justify-content-end gap-2">
          <button class="btn btn-outline-secondary" type="button" ng-click="vm.closeForm(courseForm)">Cancel</button>
          <button class="btn btn-primary" type="submit">
            <i class="bi" ng-class="vm.isEditing() ? 'bi-check-circle' : 'bi-plus-circle'" aria-hidden="true"></i>
            {{ vm.isEditing() ? 'Update' : 'Add' }}
          </button>
        </div>
      </form>
    </script>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
